name: Publish GitHub Action

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate action metadata exists
        run: |
          test -f action.yml
          echo "action.yml found"

      - name: Create GitHub Release for Marketplace tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
